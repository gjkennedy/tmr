[build-system]
requires = [
  "scikit-build-core>=0.7",
  "pybind11>=2.12",
  "mpi4py>=3.1"
]
build-backend = "scikit_build_core.build"

[project]
name = "TMR"
version = "0.0.1"
description = "Quadtree and octree based mesh refinement library"
readme = "README.md"
authors = [{ name = "Graeme J. Kennedy", email = "graeme.kennedy@aerospace.gatech.edu" }]
requires-python = ">=3.9"
dependencies = [
  "numpy", "pybind11", "setuptools", "mpi4py", "black>=25.1.0", "pre-commit>=3.5.0"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.scikit-build]
cmake.minimum-version = "3.25"
wheel.packages = ["tmr"]

[tool.mypy]
ignore_missing_imports = true
